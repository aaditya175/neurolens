[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolens-ml"
version = "0.1.0"
description = "Machine Learning engine for NeuroLens brain tumour analysis workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "pydantic>=2.0.0",
    "nibabel>=5.0.0",
    "pydicom>=2.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
full = [
    "torch>=2.0.0",
    "monai>=1.3.0",
    "SimpleITK>=2.2.0",
    "pyradiomics>=3.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
